name: CI timeout reproduction
on: [push]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run subprocess shutdown regression test
        run: python -m unittest -v test_shutdown
